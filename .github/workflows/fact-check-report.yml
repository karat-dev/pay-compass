name: Fact check report

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Охват отчёта
        required: true
        type: choice
        options:
          - all
          - country
        default: all
      country:
        description: Slug страны, если охват country (china, georgia, …)
        required: false
        type: string
        default: ""
  schedule:
    # Monday 09:00 Moscow (UTC+3). GitHub Actions cron is UTC.
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
    paths:
      - database/data/countries.json
      - config/trust_config.json

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build fact-check report
        env:
          # schedule and push have no inputs; a blank scope means the whole guide
          FACT_CHECK_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
          FACT_CHECK_COUNTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.country || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_CHAT_ID: ${{ secrets.OWNER_TELEGRAM_CHAT_ID }}
        run: python3 scripts/fact_check_report.py --json fact_check_report.json --text fact_check_report.txt --http --send-telegram

      - name: Publish job summary
        if: always()
        run: cat fact_check_report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fact-check-report
          if-no-files-found: error
          path: |
            fact_check_report.txt
            fact_check_report.json
